# Cloudflare Pages project config.
#
# The site normally deploys through Cloudflare Pages' Git integration, which
# reads its settings from the dashboard rather than this file. This exists so a
# manual `wrangler pages deploy` targets the right project instead of creating
# a new one.
#
# HTTP headers are NOT configured here - Pages serves them from `_headers`,
# which is the single source of truth and carries the Content-Security-Policy.

name = "absolutely-chaotic-draft-league"
compatibility_date = "2024-01-01"

# Static site, no build step: the repository root is what gets served.
pages_build_output_dir = "."

# D1 bindings.
#
# These live here, not in the dashboard. With a Wrangler configuration file
# present, Cloudflare treats it as the source of truth for a Pages project and
# the dashboard fields become read-only reflections of it - so a binding that is
# only in the dashboard does not survive, and a binding commented out here
# disappears from the project entirely.
#
# The ids below are this project's. A different Cloudflare account needs its own
# from `wrangler d1 create`, in both blocks, or the build fails: a deployment
# that names a database missing from the account does not start. That is what
# broke the Pages check on #7.
#
# Two databases, not one, because the features have nothing in common and very
# different write patterns: profiles takes a row at a time from real users, the
# player cache is rewritten wholesale every day. Keeping them apart means the
# daily bulk rewrite never holds a connection to user data.

# Cross-device profile sync. Read by functions/api/profile/.
#
# Named PROFILES_DB rather than a bare DB: with two databases bound, "the
# database" names neither of them, and env.DB at a call site says nothing
# about which one it opened.
[[d1_databases]]
binding = "PROFILES_DB"
database_name = "fantasy-profiles"
database_id = "533786c8-9106-4c48-8e6f-bd1f3abbf428"

# Cached NFL player list. Read by functions/api/players.js, written by
# workers/player-sync (which carries its own copy of this binding - a Worker
# deploy does not read this file).
[[d1_databases]]
binding = "PLAYERS_DB"
database_name = "fantasy-players"
database_id = "9348de19-71b8-4f62-a13c-cb44360c9b2d"

# Cached NFL schedule. Read by functions/api/schedule/, written by
# workers/schedule-sync.
#
[[d1_databases]]
binding = "SCHEDULE_DB"
database_name = "fantasy-schedule"
database_id = "ca3bb0f2-f602-4d60-a106-dc58eca6859b"