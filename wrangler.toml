# Cloudflare Pages project config.
#
# The site normally deploys through Cloudflare Pages' Git integration, which
# reads its settings from the dashboard rather than this file. This exists so a
# manual `wrangler pages deploy` targets the right project instead of creating
# a new one.
#
# HTTP headers are NOT configured here - Pages serves them from `_headers`,
# which is the single source of truth and carries the Content-Security-Policy.

name = "absolutely-chaotic-draft-league"
compatibility_date = "2024-01-01"

# Static site, no build step: the repository root is what gets served.
pages_build_output_dir = "."

# Cross-device profile sync storage, DISABLED until someone sets it up.
#
# This stays commented out deliberately. A deployment that reads a binding for a
# database which does not exist in the account fails to build, so shipping a
# placeholder ID here would make the repository undeployable for everyone who
# has not created the database - and sync is meant to be optional. With no
# binding the sync endpoints answer 503 and the app carries on using local
# storage, which is the intended unconfigured behaviour.
#
# To enable it:
#
#   1. wrangler d1 create fantasy-profiles
#   2. wrangler d1 execute fantasy-profiles --remote --file=./schema.sql
#   3. uncomment the block below and paste in the ID from step 1
#   4. add the same binding under Pages -> Settings -> Functions -> D1 database
#      bindings, which is what the Git-integrated deployment actually reads
#
# `npm test` does not need any of this: it uses tests/wrangler.test.toml, which
# carries its own local-only binding.
#
[[d1_databases]]
binding = "fantasy_profiles"
database_name = "fantasy-profiles"
database_id = "533786c8-9106-4c48-8e6f-bd1f3abbf428"

binding = "fantasy_players"
database_name = "fantasy-players"
database_id = "9348de19-71b8-4f62-a13c-cb44360c9b2d"
