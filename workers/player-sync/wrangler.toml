# Refreshes the cached NFL player database once a day.
#
# Separate from the Pages project because Pages Functions cannot run on a Cron
# Trigger. It shares the site's D1 database: this Worker writes the `players`
# and `player_cache_meta` tables, the Pages Function at /api/players reads them.
#
# Deploy:  npx wrangler deploy --config workers/player-sync/wrangler.toml
# Secret:  npx wrangler secret put REFRESH_SECRET --config workers/player-sync/wrangler.toml

name = "player-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 09:12 UTC daily - early morning US, after overnight injury and roster moves
# have settled. The offset minute keeps it off the busy top of the hour.
[triggers]
crons = ["12 9 * * *"]

# D1 binding, DISABLED until someone sets it up.
#
# Left commented out for the same reason as the one in the repository's
# wrangler.toml: naming a database that is missing from the account fails the
# deployment, and the player cache is optional. Without the binding this Worker
# deploys and its refresh answers "No D1 binding named DB", while the site keeps
# fetching from Sleeper directly - the intended unconfigured behaviour.
#
# To enable it, uncomment the block below and paste in the ID printed by
# `wrangler d1 create fantasy-profiles` - the same database the site uses.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "fantasy-profiles"
# database_id = "paste-the-id-from-wrangler-d1-create-here"

# REFRESH_SECRET is a secret, not a var - set it with `wrangler secret put`.
